<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script>
    chrome.storage.local.get(['newtabMode'], result => {
      // Default: 'on' — ayarlar sayfasından kapatılabilir
      if (result.newtabMode !== 'off') {
        window.location.replace(chrome.runtime.getURL('index.html'));
      }
    });
  </script>
  <style>
    body { margin: 0; background: #080b10; }
  </style>
</head>
<body></body>
</html>
